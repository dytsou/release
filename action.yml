name: Release (GitHub + npm)
description: Create a GitHub Release and/or publish to npmjs / GitHub Packages.
branding:
  icon: check-circle
  color: blue

inputs:
  tag:
    description: Tag to release (e.g. v1.2.3). Defaults to github.ref_name on tag push. Ignored when from-package-json=true.
    required: false
    default: ""
  body:
    description: Extra GitHub release body. Placeholders __TAG__ and __MAJOR__ are expanded.
    required: false
    default: ""
  from-package-json:
    description: Read version from package.json, optionally create the tag, and build commit notes
    required: false
    default: "false"
  package-json-path:
    description: Path to package.json
    required: false
    default: package.json
  create-missing-tag:
    description: Create and push v{version} when missing (from-package-json only)
    required: false
    default: "true"
  commit-notes:
    description: Prepend commit-list notes since previous tag (from-package-json only)
    required: false
    default: "true"
  generate-release-notes:
    description: Let GitHub generate release notes
    required: false
    default: "true"
  github-release:
    description: Create a GitHub Release
    required: false
    default: "true"
  move-major-tag:
    description: Force-update major tag (v1) (skipped for prereleases; github-release only)
    required: false
    default: "true"
  npm-publish:
    description: Publish to npmjs (dytsou/release/npm-publish)
    required: false
    default: "false"
  github-packages-publish:
    description: Publish to GitHub Packages (dytsou/release/github-packages)
    required: false
    default: "false"
  npm-token:
    description: npmjs auth token (required when npm-publish=true)
    required: false
    default: ""
  npm-access:
    description: pnpm publish --access for npmjs
    required: false
    default: public
  skip-if-exists:
    description: Skip registry publish when the version already exists
    required: false
    default: "true"
  working-directory:
    description: Directory containing package.json / lockfile for registry publish
    required: false
    default: "."
  node-version:
    description: Node.js version for registry publish
    required: false
    default: "24"
  pnpm-version:
    description: pnpm version for pnpm/action-setup (empty = packageManager field, else 10)
    required: false
    default: ""
  token:
    description: GitHub token for release, major tag, and GitHub Packages
    required: false
    default: ${{ github.token }}

outputs:
  version:
    description: package.json version when from-package-json=true
    value: ${{ steps.meta.outputs.version }}
  tag:
    description: Resolved release tag
    value: ${{ steps.meta.outputs.tag }}
  major:
    description: Major tag (e.g. v1)
    value: ${{ steps.meta.outputs.major }}
  prerelease:
    description: Whether the tag is a prerelease
    value: ${{ steps.meta.outputs.prerelease }}

runs:
  using: composite
  steps:
    - name: Resolve tag
      id: resolve
      if: inputs.from-package-json != 'true'
      shell: bash
      env:
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_BODY: ${{ inputs.body }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
      run: node "${{ github.action_path }}/lib/resolve-tag.mjs"

    - name: Sync tag from package.json
      id: sync
      if: inputs.from-package-json == 'true'
      shell: bash
      env:
        INPUT_PACKAGE_JSON_PATH: ${{ inputs.package-json-path }}
        INPUT_CREATE_MISSING_TAG: ${{ inputs.create-missing-tag }}
        INPUT_COMMIT_NOTES: ${{ inputs.commit-notes }}
        INPUT_BODY: ${{ inputs.body }}
        GITHUB_REF: ${{ github.ref }}
        GITHUB_WORKSPACE: ${{ github.workspace }}
        GITHUB_TOKEN: ${{ inputs.token }}
      run: node "${{ github.action_path }}/lib/sync-from-package-json.mjs"

    - name: Normalize outputs
      id: meta
      shell: bash
      env:
        FROM_PKG: ${{ inputs.from-package-json }}
        RESOLVE_TAG: ${{ steps.resolve.outputs.tag }}
        RESOLVE_MAJOR: ${{ steps.resolve.outputs.major }}
        RESOLVE_PRERELEASE: ${{ steps.resolve.outputs.prerelease }}
        RESOLVE_BODY: ${{ steps.resolve.outputs.body }}
        SYNC_VERSION: ${{ steps.sync.outputs.version }}
        SYNC_TAG: ${{ steps.sync.outputs.tag }}
        SYNC_MAJOR: ${{ steps.sync.outputs.major }}
        SYNC_PRERELEASE: ${{ steps.sync.outputs.prerelease }}
        SYNC_BODY: ${{ steps.sync.outputs.body }}
      run: bash "${{ github.action_path }}/lib/normalize-meta-outputs.sh"

    - name: Require at least one target
      shell: bash
      env:
        GITHUB_RELEASE: ${{ inputs.github-release }}
        NPM_PUBLISH: ${{ inputs.npm-publish }}
        GH_PKG_PUBLISH: ${{ inputs.github-packages-publish }}
      run: |
        set -euo pipefail
        if [[ "${GITHUB_RELEASE}" != "true" && "${NPM_PUBLISH}" != "true" && "${GH_PKG_PUBLISH}" != "true" ]]; then
          echo "::error::Enable github-release, npm-publish, and/or github-packages-publish"
          exit 1
        fi

    - name: Create GitHub Release
      if: inputs.github-release == 'true'
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        token: ${{ inputs.token }}
        tag_name: ${{ steps.meta.outputs.tag }}
        name: ${{ steps.meta.outputs.tag }}
        prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
        draft: false
        generate_release_notes: ${{ inputs.generate-release-notes }}
        body: ${{ steps.meta.outputs.body }}

    - name: Move major version tag
      if: inputs.github-release == 'true' && inputs.move-major-tag == 'true' && steps.meta.outputs.prerelease != 'true'
      shell: bash
      env:
        INPUT_TAG: ${{ steps.meta.outputs.tag }}
        INPUT_MAJOR: ${{ steps.meta.outputs.major }}
        GITHUB_TOKEN: ${{ inputs.token }}
      run: bash "${{ github.action_path }}/lib/move-major-tag.sh"

    - name: Setup Node (registry publish)
      if: inputs.npm-publish == 'true' || inputs.github-packages-publish == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Resolve pnpm version (registry publish)
      id: pnpm-version
      if: inputs.npm-publish == 'true' || inputs.github-packages-publish == 'true'
      shell: bash
      env:
        INPUT_PNPM_VERSION: ${{ inputs.pnpm-version }}
        INPUT_PACKAGE_JSON_PATH: ${{ inputs.package-json-path }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: node "${{ github.action_path }}/lib/resolve-pnpm-version.mjs"

    - name: Setup pnpm (registry publish)
      if: inputs.npm-publish == 'true' || inputs.github-packages-publish == 'true'
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        version: ${{ steps.pnpm-version.outputs.version }}

    - name: Read package metadata (registry publish)
      id: pkg
      if: inputs.npm-publish == 'true' || inputs.github-packages-publish == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_PACKAGE_JSON_PATH: ${{ inputs.package-json-path }}
      run: node "${{ github.action_path }}/lib/read-package-meta.mjs"

    - name: Publish to npmjs
      id: npmjs
      if: inputs.npm-publish == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_REGISTRY_KIND: npmjs
        INPUT_PACKAGE_NAME: ${{ steps.pkg.outputs.name }}
        INPUT_PACKAGE_VERSION: ${{ steps.pkg.outputs.version }}
        INPUT_PACKAGE_SCOPE: ${{ steps.pkg.outputs.scope }}
        INPUT_NPM_ACCESS: ${{ inputs.npm-access }}
        INPUT_SKIP_IF_EXISTS: ${{ inputs.skip-if-exists }}
        INPUT_INSTALL_DEPS: "true"
        INPUT_VERIFY_PACK: "true"
        NODE_AUTH_TOKEN: ${{ inputs.npm-token }}
      run: bash "${{ github.action_path }}/lib/registry-publish.sh"

    - name: Publish to GitHub Packages
      id: ghpkg
      if: inputs.github-packages-publish == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_REGISTRY_KIND: github-packages
        INPUT_PACKAGE_NAME: ${{ steps.pkg.outputs.name }}
        INPUT_PACKAGE_VERSION: ${{ steps.pkg.outputs.version }}
        INPUT_PACKAGE_SCOPE: ${{ steps.pkg.outputs.scope }}
        INPUT_SKIP_IF_EXISTS: ${{ inputs.skip-if-exists }}
        # Avoid a second install when npmjs already installed deps in this job.
        INPUT_INSTALL_DEPS: ${{ inputs.npm-publish == 'true' && 'false' || 'true' }}
        INPUT_VERIFY_PACK: ${{ inputs.npm-publish == 'true' && 'false' || 'true' }}
        NODE_AUTH_TOKEN: ${{ inputs.token }}
      run: bash "${{ github.action_path }}/lib/registry-publish.sh"
